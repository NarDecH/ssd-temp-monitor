name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pinned <6.22: newer bootloaders add onefile parent-process
          # validation that kills the update flow's relaunch chain
          pip install pystray Pillow pytest "pyinstaller>=6.22.3,<7"

      - name: Run unit tests
        run: python -m pytest tests/ -v

  build:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow "pyinstaller>=6.22.3,<7"

      - name: Build exe
        run: |
          python make_icon.py
          python make_version_file.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ssd_temp_monitor --icon app_icon.ico --version-file ssd_temp_monitor_version.txt --hidden-import pystray._win32 ssd_temp_tray.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssd_temp_monitor-exe
          path: dist/ssd_temp_monitor.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssd_temp_monitor-setup
          path: installer/ssd_temp_monitor_setup.exe

  watchdog-e2e:
    # Real end-to-end exercise of the crash watchdog on a Windows runner:
    # install -> kill the app -> a scheduled task must restart it -> the
    # quit marker must keep it down (tools/e2e_watchdog_test.ps1 clones
    # the task under a test name and cleans up after itself).
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ssd_temp_monitor-setup
          path: installer

      - name: Silent install (registers the watchdog task)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\installer\ssd_temp_monitor_setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Write-Output "install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $t = Get-ScheduledTask -TaskName "SSDTempMonitor Watchdog" -ErrorAction SilentlyContinue
          if (-not $t) { Write-Output "::error::watchdog task not registered by installer"; exit 1 }
          Write-Output "watchdog task state: $($t.State)"

      - name: Run E2E watchdog test (real restart + marker cases)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools\e2e_watchdog_test.ps1 -WaitSeconds 150

      - name: Collect E2E evidence on failure
        if: failure()
        shell: pwsh
        run: |
          # upload-artifact only reaches files inside the workspace - copy
          # the app's logs (in %APPDATA%) in first
          New-Item -ItemType Directory -Force -Path e2e-logs | Out-Null
          Copy-Item "$env:APPDATA\SSDTempMonitor\watchdog.log*" -Destination e2e-logs\ -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\SSDTempMonitor\ssd_temp_monitor.log" -Destination e2e-logs\ -ErrorAction SilentlyContinue
          Get-ChildItem e2e-logs | ForEach-Object { Write-Output "collected: $($_.Name)" }

      - name: Upload E2E evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-e2e-logs
          path: e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Uninstall (cleanup)
        if: always()
        shell: pwsh
        run: |
          Unregister-ScheduledTask -TaskName "SSDTempMonitor Watchdog E2E" -Confirm:$false -ErrorAction SilentlyContinue
          Stop-Process -Name ssd_temp_monitor -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (Test-Path "C:\Program Files\SSD Temp Monitor\unins000.exe") {
            $p = Start-Process -FilePath "C:\Program Files\SSD Temp Monitor\unins000.exe" `
              -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/FORCECLOSEAPPLICATIONS" -Wait -PassThru
            Write-Output "uninstall exit code: $($p.ExitCode)"
          }
          Write-Output "cleanup OK"

  installer-test:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ssd_temp_monitor-setup
          path: installer

      - name: Silent install
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\installer\ssd_temp_monitor_setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Write-Output "install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Verify installed files
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\SSD Temp Monitor\ssd_temp_monitor.exe")) { exit 1 }
          if (-not (Test-Path "C:\Program Files\SSD Temp Monitor\unins000.exe")) { exit 1 }
          Write-Output "installed files OK"

      - name: Single-instance duplicate check
        shell: pwsh
        run: |
          $exe = "C:\Program Files\SSD Temp Monitor\ssd_temp_monitor.exe"
          $first = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if (-not (Get-Process -Name ssd_temp_monitor -ErrorAction SilentlyContinue)) { exit 1 }
          $second = Start-Process -FilePath $exe -ArgumentList "--duplicate-silent" -PassThru
          Start-Sleep -Seconds 10
          if (-not $second.HasExited) { exit 1 }
          if ($second.ExitCode -ne 2) { exit 1 }
          Write-Output "duplicate instance exited with code 2 as designed"

      - name: Uninstall
        shell: pwsh
        run: |
          Stop-Process -Name ssd_temp_monitor -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          # /FORCECLOSEAPPLICATIONS: do not let a straggling instance or a
          # transient file lock fail the silent uninstall (seen once on CI)
          $p = Start-Process -FilePath "C:\Program Files\SSD Temp Monitor\unins000.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/FORCECLOSEAPPLICATIONS" -Wait -PassThru
          Write-Output "uninstall exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          # wait until the exe is really gone (up to 15 s)
          $gone = $false
          foreach ($i in 1..15) {
            if (-not (Test-Path "C:\Program Files\SSD Temp Monitor\ssd_temp_monitor.exe")) { $gone = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) { exit 1 }
          Write-Output "uninstall OK"
