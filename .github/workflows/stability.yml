name: Stability

# Daily health check for the release pipeline and the test suite.
# NOTE: the 24h-stability criteria (event log / watchdog log / history)
# live on the USER'S machine - a runner has none. What CI CAN verify
# daily is that the suite is green and the latest release is complete
# and published. If that breaks, open an issue so it cannot rot quietly.
# On-machine stability is checked with tools/stability_report.ps1.

on:
  schedule:
    - cron: "0 21 * * *"   # daily 21:00 UTC = 04:00 Bangkok
  workflow_dispatch:

permissions:
  issues: write

jobs:
  daily-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Latest release must exist and be published
        id: release
        shell: pwsh
        run: |
          $r = Invoke-RestMethod -Uri `
            'https://api.github.com/repos/${{ github.repository }}/releases/latest'
          Write-Output "tag=$($r.tag_name) draft=$($r.draft) assets=$($r.assets.Count)"
          if ($r.draft) { Write-Output '::error::latest release is a draft'; exit 1 }
          if ($r.assets.Count -lt 5) {
            Write-Output "::error::expected >=5 assets, got $($r.assets.Count)"
            exit 1
          }
          "tag=$($r.tag_name)" >> $env:GITHUB_OUTPUT

      - name: Open an issue when the daily check failed
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let tag = 'unknown';
            try {
              const out = fs.readFileSync(process.env.GITHUB_OUTPUT, 'utf8');
              const m = out.match(/tag=(\S+)/);
              if (m) tag = m[1];
            } catch (e) {}
            const date = new Date().toISOString().slice(0, 10);
            const title = `[stability] daily check failed (${date})`;
            const body =
              'Daily stability workflow failed.\n\n' +
              `- run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}\n` +
              `- latest release at check time: ${tag}\n\n` +
              'Likely causes: failing unit tests, a missing/incomplete ' +
              'release, or an infrastructure flake. Re-run the workflow ' +
              'before digging deeper.';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 50 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failed again on ${date}: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body });
            }
