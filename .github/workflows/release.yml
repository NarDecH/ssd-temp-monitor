name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pinned <6.22: newer bootloaders add onefile parent-process
          # validation that kills the update flow's relaunch chain
          pip install pystray Pillow pytest "pyinstaller>=6.22.3,<7"

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Sync APP_VERSION and setup.iss with tag
        shell: bash
        run: |
          # the tag is the single source of truth: a forgotten version bump
          # in the source used to ship exes that report an older version and
          # then see their own release as "an update"
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^APP_VERSION = .*$/APP_VERSION = \"${VER}\"        # keep in sync with setup.iss #define MyAppVersion/" ssd_temp_tray.py
          sed -i "s/^#define MyAppVersion .*$/#define MyAppVersion \"${VER}\"/" setup.iss
          grep -q "APP_VERSION = \"${VER}\"" ssd_temp_tray.py
          grep -q "MyAppVersion \"${VER}\"" setup.iss

      - name: Build exe
        run: |
          python make_icon.py
          python make_version_file.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ssd_temp_monitor --icon app_icon.ico --version-file ssd_temp_monitor_version.txt --hidden-import pystray._win32 ssd_temp_tray.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Sign binaries (optional, secrets-gated)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          SIGNING_TSA_URL: ${{ secrets.SIGNING_TSA_URL }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) {
            Write-Output "No signing certificate configured - releasing unsigned."
            Write-Output "See docs/CODE_SIGNING.md to enable Authenticode signing."
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          try {
            & $signtool sign /fd SHA256 /f $pfx /p "$env:SIGNING_PFX_PASSWORD" `
              /tr "$env:SIGNING_TSA_URL" /td SHA256 `
              "dist\ssd_temp_monitor.exe" "installer\ssd_temp_monitor_setup.exe"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          Write-Output "binaries signed"

      - name: Verify signatures (only when signing is enabled)
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) {
            Write-Output "Signing disabled - skipping signature verification."
            exit 0
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe | Select-Object -First 1 -ExpandProperty FullName
          foreach ($f in "dist\ssd_temp_monitor.exe", "installer\ssd_temp_monitor_setup.exe") {
            & $signtool verify /pa /all $f
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Signature verification failed for $f"
              exit 1
            }
          }
          Write-Output "signatures verified OK"

      - name: Smoke-test installed exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\installer\ssd_temp_monitor_setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "C:\Program Files\SSD Temp Monitor\ssd_temp_monitor.exe")) { exit 1 }
          Write-Output "installer smoke test OK"

      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG (and tag sanity check)
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"                 # e.g. v1.9.0-rc1
          $ver = $tag.TrimStart('v')
          $md = Get-Content docs/CHANGELOG.md -Raw
          $m = [regex]::Match($md, '(?s)## \[' + [regex]::Escape($ver) + '\].*?(?=\r?\n## \[|$)')
          if (-not $m.Success) {
            Write-Output "::warning::docs/CHANGELOG.md has no [[$ver]] section - using a stub"
            $body = "Release $tag`n`n(No changelog entry found for this version.)"
          } else {
            $body = $m.Value -replace '^## \[([^\]]+)\].*$', "## $tag"
          }
          # published date sanity check: changelog date must be today
          if ($m.Success -and $m.Value -match '## \[[^\]]+\] — (\d{4}-\d{2}-\d{2})') {
            $docDate = $Matches[1]
            $today = (Get-Date).ToString('yyyy-MM-dd')
            if ($docDate -ne $today) {
              Write-Output "::warning::CHANGELOG date $docDate differs from release date $today"
            }
          }
          $body = $body + "`n`n**Downloads**`n" +
            "- ``ssd_temp_monitor_setup_$ver.exe`` — installer (แนะนำ)`n" +
            "- ``ssd_temp_monitor_$ver.exe`` — portable`n`n" +
            "🔒 ดาวน์โหลดถูกตรวจ SHA-256 กับ ``SHA256SUMS.txt`` โดยแอปอัตโนมัติ`n"
          $body = $body.Replace('"', '""')
          Add-Content $env:GITHUB_OUTPUT "notes<<EOF_NOTES"
          Add-Content $env:GITHUB_OUTPUT $body
          Add-Content $env:GITHUB_OUTPUT "EOF_NOTES"
          $isPre = if ($tag -match '-') { 'true' } else { 'false' }
          Add-Content $env:GITHUB_OUTPUT "prerelease=$isPre"

      - name: Rename artifacts with version
        shell: pwsh
        run: |
          Copy-Item "dist\ssd_temp_monitor.exe" "ssd_temp_monitor_v${{ steps.ver.outputs.version }}.exe"
          Copy-Item "installer\ssd_temp_monitor_setup.exe" "ssd_temp_monitor_setup_v${{ steps.ver.outputs.version }}.exe"
          # portable package: keep settings/history next to the exe
          New-Item -ItemType Directory -Force -Path "portable_tmp\portable_data" | Out-Null
          Copy-Item "ssd_temp_monitor_v${{ steps.ver.outputs.version }}.exe" "portable_tmp\"
          New-Item -ItemType File -Force -Path "portable_tmp\portable_data\.keep" | Out-Null
          Compress-Archive -Path "portable_tmp\*" -DestinationPath "ssd_temp_monitor_v${{ steps.ver.outputs.version }}_portable.zip" -Force

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "ssd_temp_monitor*_v*.exe") +
                   @(Get-ChildItem "ssd_temp_monitor*_v*_portable.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines -join "`n" | Set-Content -NoNewline -Encoding ascii SHA256SUMS.txt
          Write-Output (Get-Content SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SSD Temperature Monitor ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ steps.notes.outputs.prerelease }}
          files: |
            ssd_temp_monitor_v${{ steps.ver.outputs.version }}.exe
            ssd_temp_monitor_setup_v${{ steps.ver.outputs.version }}.exe
            ssd_temp_monitor_v${{ steps.ver.outputs.version }}_portable.zip
            SHA256SUMS.txt
