name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pystray Pillow pytest pyinstaller

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --uac-admin --name ssd_temp_monitor --icon app_icon.ico
          --hidden-import pystray._win32 ssd_temp_tray.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Smoke-test installed exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\installer\ssd_temp_monitor_setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "C:\Program Files\SSD Temp Monitor\ssd_temp_monitor.exe")) { exit 1 }
          Write-Output "installer smoke test OK"

      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Rename artifacts with version
        shell: pwsh
        run: |
          Copy-Item "dist\ssd_temp_monitor.exe" "ssd_temp_monitor_v${{ steps.ver.outputs.version }}.exe"
          Copy-Item "installer\ssd_temp_monitor_setup.exe" "ssd_temp_monitor_setup_v${{ steps.ver.outputs.version }}.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SSD Temperature Monitor v${{ steps.ver.outputs.version }}
          body: |
            ## SSD Temperature Monitor v${{ steps.ver.outputs.version }}

            **Downloads**
            - `ssd_temp_monitor_setup_v${{ steps.ver.outputs.version }}.exe` — installer (แนะนำ, มี auto-start option)
            - `ssd_temp_monitor_v${{ steps.ver.outputs.version }}.exe` — portable, รันได้ทันที

            ทั้งสองไฟล์ต้องการสิทธิ์ Administrator (UAC) เพื่ออ่านอุณหภูมิ SMART
          draft: false
          prerelease: false
          files: |
            ssd_temp_monitor_v${{ steps.ver.outputs.version }}.exe
            ssd_temp_monitor_setup_v${{ steps.ver.outputs.version }}.exe
