<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Diagram of the fix">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="18" fill="#0f172a"/>
  <text x="460" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" fill="#f8fafc" font-weight="700">วิธีแก้ — กรอง BusType + Sanity Check</text>

  <!-- PowerShell filter -->
  <rect x="60" y="90" width="340" height="120" rx="12" fill="#0c2a3f" stroke="#0ea5e9" stroke-width="2"/>
  <text x="80" y="122" font-family="Consolas, monospace" font-size="14" fill="#7dd3fc">Get-PhysicalDisk | Where-Object {</text>
  <text x="80" y="148" font-family="Consolas, monospace" font-size="14" fill="#4ade80" font-weight="700">  MediaType -eq 'SSD'</text>
  <text x="80" y="174" font-family="Consolas, monospace" font-size="14" fill="#4ade80" font-weight="700">  -and BusType -ne 'USB'</text>
  <text x="80" y="198" font-family="Consolas, monospace" font-size="14" fill="#7dd3fc">}</text>

  <!-- sanity check -->
  <rect x="470" y="90" width="390" height="120" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="490" y="122" font-family="Segoe UI, sans-serif" font-size="16" fill="#f8fafc" font-weight="600">Python: sanity check ทุกค่า</text>
  <text x="490" y="150" font-family="Consolas, monospace" font-size="13" fill="#86efac">int(raw) กัน None/""  →  -20 ≤ temp ≤ 100</text>
  <text x="490" y="174" font-family="Segoe UI, sans-serif" font-size="13" fill="#86efac">นอกช่วงหรือแปลงไม่ได้ → ถือว่า n/a (ไม่เอาค่ามั่ว)</text>
  <text x="490" y="198" font-family="Segoe UI, sans-serif" font-size="12" fill="#6ee7b7">กันเธรดอัปเดตล่มเงียบ ๆ จาก int("") ด้วย</text>

  <line x1="400" y1="150" x2="462" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- tray result -->
  <rect x="150" y="260" width="140" height="140" rx="20" fill="#22c55e"/>
  <text x="220" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="52" fill="#ffffff" font-weight="700">42</text>
  <text x="220" y="368" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" fill="#dcfce7" font-weight="600">°C</text>
  <text x="220" y="240" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">ไอคอน tray เห็นเฉพาะ SSD ภายใน</text>

  <!-- excluded USB -->
  <rect x="600" y="260" width="200" height="90" rx="12" fill="#334155" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="700" y="298" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#cbd5e1" font-weight="600">USB reader (เสียบได้)</text>
  <text x="700" y="322" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">ไม่ถูกนับ — ไม่กระทบค่า</text>
  <text x="700" y="344" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#94a3b8">🚫</text>

  <path d="M290 330 C 380 380, 520 380, 592 330" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M290 300 C 380 250, 520 250, 592 300" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arr2)"/>
</svg>
