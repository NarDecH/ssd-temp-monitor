<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-label="Color scale legend">
  <defs>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="760" height="150" rx="14" fill="#0f172a"/>
  <rect x="50" y="30" width="660" height="22" rx="11" fill="url(#scale)"/>
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="50" y="78">≤ 50</text>
    <text x="330" y="78" text-anchor="middle">51–64</text>
    <text x="662" y="78">≥ 65 °C</text>
  </g>
  <g font-family="Segoe UI, sans-serif" font-size="12">
    <text x="118" y="78" fill="#86efac">เขียว — ปกติ</text>
    <text x="404" y="78" text-anchor="middle" fill="#fcd34d">ส้ม — เฝ้าระวัง</text>
  </g>
  <text x="640" y="78" fill="#fca5a5">แดง — ร้อน</text>

  <!-- digit-color rule (v1.10.0): adaptive contrast on the pill -->
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">
    <text x="50" y="122">สีตัวเลขปรับตามพื้นอัตโนมัติ:</text>
  </g>
  <rect x="300" y="106" width="52" height="26" rx="7" fill="#22c55e"/>
  <text x="326" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#11111b">45</text>
  <rect x="360" y="106" width="52" height="26" rx="7" fill="#f59e0b"/>
  <text x="386" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#11111b">58</text>
  <rect x="420" y="106" width="52" height="26" rx="7" fill="#ef4444"/>
  <text x="446" y="125" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="0.5">72</text>
  <g font-family="Segoe UI, sans-serif" font-size="13">
    <text x="484" y="125" fill="#94a3b8">เลขดำเข้มบนเขียว/ส้ม · เลขขาวบนแดง</text>
  </g>
</svg>
