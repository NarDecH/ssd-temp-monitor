<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-label="SSD Temperature Tray Monitor banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="920" height="230" rx="18" fill="url(#bg)"/>
  <!-- decorative circuit lines -->
  <g stroke="#334155" stroke-width="2" fill="none" opacity="0.6">
    <path d="M600 40 h90 v40 h60"/>
    <path d="M640 200 h-50 v-30"/>
    <path d="M780 190 h60 v-40"/>
    <circle cx="750" cy="80" r="4" fill="#334155"/>
    <circle cx="640" cy="170" r="4" fill="#334155"/>
  </g>
  <!-- chip drawing -->
  <g transform="translate(660,70)">
    <rect x="0" y="0" width="120" height="120" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="22" y="22" width="76" height="76" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#94a3b8" font-weight="600">SSD</text>
    <text x="60" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" fill="#22c55e" font-weight="700">42°</text>
    <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
      <line x1="-14" y1="30" x2="0" y2="30"/><line x1="-14" y1="60" x2="0" y2="60"/><line x1="-14" y1="90" x2="0" y2="90"/>
      <line x1="120" y1="30" x2="134" y2="30"/><line x1="120" y1="60" x2="134" y2="60"/><line x1="120" y1="90" x2="134" y2="90"/>
      <line x1="30" y1="-14" x2="30" y2="0"/><line x1="60" y1="-14" x2="60" y2="0"/><line x1="90" y1="-14" x2="90" y2="0"/>
      <line x1="30" y1="120" x2="30" y2="134"/><line x1="60" y1="120" x2="60" y2="134"/><line x1="90" y1="120" x2="90" y2="134"/>
    </g>
  </g>
  <!-- title -->
  <text x="48" y="92" font-family="Segoe UI, sans-serif" font-size="40" fill="#f8fafc" font-weight="700">SSD Temperature</text>
  <text x="48" y="138" font-family="Segoe UI, sans-serif" font-size="40" fill="#f8fafc" font-weight="700">Tray Monitor</text>
  <text x="50" y="170" font-family="Segoe UI, sans-serif" font-size="16" fill="#94a3b8">Windows system tray · Python · PowerShell</text>
  <rect x="48" y="192" width="140" height="6" rx="3" fill="url(#heat)"/>
</svg>
